# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.1.4
      - name: Set up JDK 21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build with Gradle
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee gradle.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Surface Gradle failure as annotations
        if: steps.gradle.outputs.exit_code != '0'
        run: |
          echo "::group::Full gradle log"
          cat gradle.log
          echo "::endgroup::"
          awk '
            /^FAILURE:|^\* What went wrong:|^\* Where:|^Caused by:|^> / { print "::error::" $0; next }
            /Could not (resolve|find|GET)/ { print "::error::" $0; next }
            /\.java:[0-9]+: error:/ { print "::error::" $0; next }
          ' gradle.log || true
          exit 1
      - name: Upload a Build Artifact
        if: steps.gradle.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4.3.3
        with:
          # Artifact name
          name: StressTestBots-Artifact
          # A file, directory or wildcard pattern that describes what to upload
          path: build/libs/StressTestBots-*.jar
      - name: Upload gradle log on failure
        if: always() && steps.gradle.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4.3.3
        with:
          name: gradle-log
          path: gradle.log
